<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .otp-card {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .icon {
            width: 60px;
            height: 60px;
            background: #f59e0b;
            color: white;
            border-radius: 12px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        h2 {
            margin-bottom: 10px;
            color: #1f2937;
            font-size: 28px;
        }

        p {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .message {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 18px;
            box-sizing: border-box;
            text-align: center;
            letter-spacing: 3px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .note {
            margin-top: 20px;
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>

<body>

<div class="otp-card">
    <div class="icon">🏨</div>

    <h2>OTP Verification</h2>
    <p>Please enter the verification code sent to your Gmail account.</p>

    {% for message in messages %}
        <div class="message">{{ message }}</div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="otp" placeholder="Enter OTP" maxlength="6" required>

        <button type="submit">Verify OTP</button>
    </form>

    <div class="note">
        This code is required to complete your account registration.
    </div>
</div>

</body>
</html>
