<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StayEase – Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#3d5af1;--blue-dark:#2a3fd6;--blue-light:#eef0fd;--orange:#f97316;--text-dark:#1a1f36;--text-mid:#6b7280;--border:#e5e7eb;--white:#fff;--bg:#f3f4ff}
body{min-height:100vh;background:var(--bg);font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:white;border-radius:24px;box-shadow:0 8px 40px rgba(61,90,241,.12);padding:44px 40px;width:100%;max-width:420px}
.icon-wrap{width:64px;height:64px;background:linear-gradient(135deg,#f97316,#fb923c);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.icon-wrap svg{width:32px;height:32px;fill:white}
h1{font-family:'DM Serif Display',serif;font-size:26px;text-align:center;color:var(--text-dark);margin-bottom:8px}
.subtitle{text-align:center;color:var(--text-mid);font-size:14px;line-height:1.6;margin-bottom:28px}
.info-box{background:var(--blue-light);border-left:3px solid var(--blue);border-radius:0 10px 10px 0;padding:12px 14px;font-size:13px;color:#374ba8;line-height:1.6;margin-bottom:22px}
.message{font-size:13px;text-align:center;margin-bottom:14px;color:#ef4444}
.field{margin-bottom:20px}
label{display:block;font-size:13px;font-weight:600;color:var(--text-dark);margin-bottom:7px}
input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;background:#fafafa;outline:none}
input:focus{border-color:var(--blue);background:white;box-shadow:0 0 0 3px rgba(61,90,241,.10)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--blue);color:white;box-shadow:0 4px 14px rgba(61,90,241,.35)}
.btn-primary:hover{background:var(--blue-dark)}
.back-link{display:flex;align-items:center;justify-content:center;margin-top:24px;font-size:14px;color:var(--text-mid);text-decoration:none}
</style>
</head>
<body>

<div class="card">
    <div class="icon-wrap">
        <svg viewBox="0 0 24 24">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
        </svg>
    </div>

    <h1>Forgot Password?</h1>
    <p class="subtitle">We'll send a 6-digit OTP to your email.</p>

    {% for message in messages %}
        {% if message.tags == 'error' %}
            <p class="message">{{ message }}</p>
        {% endif %}
    {% endfor %}

    <div class="info-box">
        Enter the email address linked to your StayEase account.
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="field">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="you@example.com" required>
        </div>

        <button class="btn btn-primary" type="submit">Send OTP</button>
    </form>

    <a class="back-link" href="/#loginPage">← Back to Sign In</a>
</div>

</body>
</html>
